[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scigantic-pubchem"
version = "0.7.0"
description = "Query PubChem live via PUG REST, with rate-limit-aware retry, expiring cache, live similarity/substructure/cross-reference search, bioassay/gene/protein/PDB cross-reference data (with a streaming downloader), the Tox21 Data Challenge panel, and CID-keyed reads of a local parquet mirror of the identifier/name/mass registry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT-0" }
authors = [{ name = "Scigantic" }]
keywords = ["pubchem", "cheminformatics", "pug-rest", "drug-discovery", "identifier-resolution", "bioassay", "gene", "protein", "tox21", "toxicology", "pdb"]
classifiers = [
  "License :: OSI Approved :: MIT No Attribution License (MIT-0)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
  "requests>=2.28",
]

[project.optional-dependencies]
# duckdb is only needed for chembl_context()/bindingdb_measurements(), the
# live cross-references into scigantic-chembl/scigantic-bindingdb; every
# other function in this package works without it.
bridge = ["duckdb>=0.10", "pandas>=1.5"]
dev = ["pytest>=7", "mypy>=1.10", "types-requests", "pandas-stubs"]

[project.urls]
Homepage = "https://scigantic.com"
Repository = "https://github.com/Scigantic/scigantic-pubchem"
Issues = "https://github.com/Scigantic/scigantic-pubchem/issues"

[project.scripts]
scigantic-pubchem = "scigantic_pubchem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scigantic_pubchem = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
